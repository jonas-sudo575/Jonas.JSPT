<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="PROYECTOS">
<defs>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d8b4fe"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a855f7" stop-opacity="0.9"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4c1d95" stop-opacity="0.45"/><stop offset="0.5" stop-color="#4c1d95" stop-opacity="0"/></linearGradient>
<radialGradient id="ic"><stop offset="0" stop-color="#a855f7" stop-opacity="0.6"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect x="0.5" y="0.5" width="999" height="63" rx="14" fill="#05010a" stroke="#2e1065"/>
<rect x="0.5" y="0.5" width="999" height="63" rx="14" fill="url(#sh)"/>
<g transform="translate(44 32)">
<circle r="26" fill="url(#ic)"/>
<g transform="rotate(-16)"><ellipse rx="23" ry="6.5" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="14 6 6 10"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="3s" repeatCount="indefinite"/></ellipse></g>
<circle r="9" fill="#000" stroke="#e9d5ff" stroke-width="1.5" filter="url(#glow)"/>
<g transform="rotate(-16)"><path d="M-23,0 A23,6.5 0 0 0 23,0" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="14 6 6 10"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="3s" repeatCount="indefinite"/></path></g>
</g>
<text x="88" y="25" font-size="12" letter-spacing="3" font-family="'Fira Code','DejaVu Sans Mono','Courier New',monospace" fill="#a78bfa">05 // proyectos/</text>
<text x="88" y="52" font-size="24" font-weight="800" letter-spacing="3" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="url(#t)">PROYECTOS</text>
<rect x="380" y="31" width="580" height="2" fill="url(#ln)"/>
<circle cy="32" r="2.5" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="380;960" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="4s" repeatCount="indefinite"/></circle>
</svg>